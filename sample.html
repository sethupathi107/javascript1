<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
            min-height: 1500px;
        }

        form {
            width: 400px;
            padding: 20px;
            border: 1px solid #ccc;
        }

        input {
            display: block;
            width: 90%;
            padding: 10px;
            margin: 8px 0 15px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        .error {
            color: red;
            font-size: 14px;
        }

        .success {
            margin-top: 20px;
            padding: 15px;
            background: lightgreen;
        }

        .focused {
            border: 2px solid blue;
        }

        #users {
            margin-top: 30px;
        }

        .user {
            padding: 10px;
            margin: 10px 0;
            background: #eee;
        }
    </style>
</head>

<body>

    <h1 id="title">Registration Form</h1>

    <form class="register" id="registrationForm">

        <label>
            Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="Enter your name"
        >

        <p id="nameError" class="error"></p>


        <label>
            Email
        </label>

        <input
            id="email"
            type="email"
            placeholder="Enter your email"
        >

        <p id="emailError" class="error"></p>


        <label>
            Age
        </label>

        <input
            id="age"
            type="number"
            min="18"
            max="100"
        >


        <button id="submitButton" type="submit">
            Register
        </button>

    </form>


    <div id="message"></div>


    <h2>Registered Users</h2>

    <div id="users"></div>
</body>
</html>
